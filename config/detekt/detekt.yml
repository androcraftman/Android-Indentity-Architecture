build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 15
    thresholdInObjects: 20
    thresholdInEnums: 15
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
    ignoreDefaultParameters: true

naming:
  FunctionNaming:
    active: true
    functionPattern: '([a-z][a-zA-Z0-9]*)|([A-Z][a-zA-Z0-9]*)'
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][A-Za-z0-9]*'
  PackageNaming:
    active: true
    packagePattern: '[a-z_]+(\.[a-z_][A-Za-z0-9_]*)*'

style:
  WildcardImport:
    active: true
  UnusedPrivateMember:
    active: true
  MagicNumber:
    active: false
  NewLineAtEndOfFile:
    active: true
